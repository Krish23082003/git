name: Daily Blog Post

on:
  schedule:
    - cron: '30 4 * * *'  # Runs every day at 10:00 AM IST (adjust as needed)
  workflow_dispatch:      # Lets you run manually if needed

jobs:
  run-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run blog script
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_CHAT_ENDPOINT: ${{ secrets.AZURE_CHAT_ENDPOINT }}
          AZURE_DALLE2_ENDPOINT: ${{ secrets.AZURE_DALLE2_ENDPOINT }}
          AZURE_DALLE3_API_KEY: ${{ secrets.AZURE_DALLE3_API_KEY }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_API_TOKEN_PROSO: ${{ secrets.WEBFLOW_API_TOKEN_PROSO }}
          WEBFLOW_COLLECTION_ID: ${{ secrets.WEBFLOW_COLLECTION_ID }}
          WEBFLOW_COLLECTION_ID_PROSO: ${{ secrets.WEBFLOW_COLLECTION_ID_PROSO }}
        run: node workwall.js
